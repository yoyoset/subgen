[package]
name = "subgen"
version = "0.1.0"
edition = "2024"

[dependencies]
# 只启用 glow(OpenGL)渲染后端,不编译 wgpu 进来——实测遇到过一次主程序意外退出,大概率是
# wgpu 渲染层在和 whisper-cli/llama-server 抢同一块物理 GPU 时"设备丢失直接 panic"(wgpu
# 默认行为就是这样)。glow 对设备丢失的容忍度远高于 wgpu,这个 UI 也用不到 wgpu 的能力,
# 干脆从编译产物里去掉,从根上排除这个崩溃源,而不是指望运行时不触发。
# eframe 对 winit 的依赖本身固定带了 rwh_06(不受 feature 开关影响);winit 自己的
# default feature(x11/wayland 等)只影响 Linux 后端选择,Windows 后端按 target_os 编译、
# 不受 Cargo feature 门控,所以不需要单独打开 winit 的 default feature。x11/wayland/
# web_screen_reader 同理是 Linux/Web 专属,本项目只发行 Windows 版,不需要。
eframe = { version = "0.35.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
] }
fs4 = "1.1.0"
reqwest = { version = "0.13.4", features = ["blocking", "stream", "json"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
toml = "1.1.3"
win32job = "2.0.3"
zip = "8.6.0"

[build-dependencies]
# 把 assets/icon.ico 嵌进 exe 资源(File Explorer/任务栏在程序没运行时显示的图标就来自
# 这里);运行时窗口本身的图标是另一码事,由 main.rs 的 ViewportBuilder::with_icon 单独设置。
winresource = "0.1.31"
