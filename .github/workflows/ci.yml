name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check source line budgets
        shell: pwsh
        run: ./scripts/check-line-budgets.ps1
